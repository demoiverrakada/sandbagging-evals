[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbagging-evals"
version = "0.1.0"
description = "Exploratory sandbagging detector evaluations across an access ladder"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Umang Agarwal" },
]
license = { text = "MIT" }
dependencies = [
  "accelerate>=0.33",
  "datasets>=2.20",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "tqdm>=4.66",
  "transformers>=4.44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
